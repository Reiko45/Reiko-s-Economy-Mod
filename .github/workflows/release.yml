name: Release

# Pushing a tag like v1.0.0 builds the mod, makes a GitHub release with the jar and that version's notes from
# CHANGELOG.md, and (once they're set up, see docs/PUBLISHING.md) uploads it to Modrinth and CurseForge.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches the mod version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match mod_version=$version in gradle.properties."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Take this version's notes from the changelog
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 {found = 1; next} /^## / {if (found) exit} found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi
          cat release-notes.md

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Make the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Reiko's Economy Mod ${{ env.VERSION }}
          body_path: release-notes.md
          files: build/libs/reikoeconomy-${{ env.VERSION }}.jar

      # Runs once the MODRINTH_ID and/or CURSEFORGE_ID repository variables are set. A site whose token secret
      # is missing is skipped.
      - name: Publish to Modrinth and CurseForge
        if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/reikoeconomy-${{ env.VERSION }}.jar
          name: Reiko's Economy Mod ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
