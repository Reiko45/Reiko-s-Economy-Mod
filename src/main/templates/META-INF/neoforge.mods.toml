# Mod metadata. The placeholder values are filled in from gradle.properties at build time.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Reiko45/Reiko-s-Economy-Mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Reiko45/Reiko-s-Economy-Mod"
# A pixel-art coin, so it's drawn sharp rather than blurred.
logoFile="logo.png"
logoBlur=false
description='''
A complete economy for singleplayer and multiplayer, all in one mod:
bank accounts and /pay, coins, bills and wallets, ATMs with debit and credit cards, savings and loans, player shops that sell and buy, an auction house, safe trading between players, shared accounts for towns and teams, jobs with daily contracts, player bounties, villagers that trade for money, and taxes that keep prices in check.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Opens up MerchantMenu.trader (see the file for why).
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
